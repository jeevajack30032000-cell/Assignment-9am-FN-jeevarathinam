<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard layout</title>
<style>
        .dashboard-container {
  display: grid;
  min-height: 100vh;
  width: 100%;
  grid-template-columns: 200px 1fr;
  grid-template-rows: 60px 1fr 40px;
  grid-template-areas:
    "header      header" 
    "sidebar     main-content"
    "sidebar     footer";
        }

.header {
  grid-area: header;
  background-color: #3f51b5;
  color: white;
}

.sidebar {
  grid-area: sidebar;
  background-color: #f0f0f0;
  padding: 15px;
}

.main-content {
  grid-area: main-content;
  background-color: #ffffff;
  padding: 20px;
}

.footer {
  grid-area: footer;
  background-color: #333;
  color: white;
  text-align: center;
}
.dashboard-container > * {
  display: flex;
  align-items: center;
  padding-left: 15px;
}
.sidebar {
  display: block;
}
.main-content {
  grid-area: main-content;
  display: grid;
  grid-template-columns: 3fr 1fr;  
  grid-template-areas: "report-area stats-panel"; 
  gap: 10px;
  padding: 20px;
}

.main-content > .report-area { 
  grid-area: report-area;
  background-color: #e8eaf6;
  padding: 15px;
}
    </style>
</head>

<body>
    <div class="dashboard-container">
  <header class="header">Dashboard Header</header>
  <nav class="sidebar">Navigation Menu</nav>
  <main class="main-content">Main Chart/Report Area</main>
  <div class="stats-panel">Quick Stats/Widgets</div>
  <footer class="footer">Copyright & Info</footer>
</div>
</body>

</html>
