<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />



</head>
<body>
    <div class="bg-danger py-5">
        <header class="text-center mb-5">
            <h1>Welcome to Our Startup</h1>
            <p class="lead">Building amazing products with Bootstrap</p>
            <button class="btn btn-primary btn-lg">Get Started</button>
        </header>
        <div class="row bg-warning">
            <div class="col-md-6 mb-4">
                <h3>Our Mission</h3>
                <p>We aim to deliver high-quality apps that enhance productivity and creativity.</p>
                <button class="btn btn-outline-primary">Learn More</button>
            </div>
            <div class="col-md-6 mb-4">
                <h3>Join Us</h3>
                <p>Be part of a dynamic team focused on innovation and growth.</p>
                <button class="btn btn-outline-success">Contact Us</button>
            </div>
        </div>
    </div>
    <footer style="height:150px" class="text-center bg-secondary p-5">
        &copy; 2025 landing project all right are reserved | built by bootstrap
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
