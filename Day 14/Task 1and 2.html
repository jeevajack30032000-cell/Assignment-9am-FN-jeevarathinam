<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>practice task</title>

    <!-- bootstrap CDN links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

  </head>
  <body>
    <h1 class="text-center mb-5">Task1:Add Bootstrap to a page and create 3 different buttons</h1>

    <div class="container bg-black text-center p-3 mt-2">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">secondary</button>
      <button type="button" class="btn btn-warning">Warning</button>
      <button type="button" class="btn btn-danger">danger</button>
      <button type="button" class="btn btn-secondary" disabled>Button</button>
      <button type="button" class="btn btn-info" disabled>Button</button>
      <button type="button" class="btn btn-outline-light">Light</button>
    </div>
    <hr />
    <h1 class="text-center mb-4">task2:make a bootstrap grid with 3columns</h1>

    <div class="container text-center">
      <div class="row">
        <div class="col bg-success p-3 m-2">Column1</div>
        <div class="col bg-warning p-3 m-2">Column2</div>
        <div class="col bg-danger p-3 m-2">Column3</div>
      </div>
    </div>


    <!-- bootstrap js link -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

  </body>
</html>
