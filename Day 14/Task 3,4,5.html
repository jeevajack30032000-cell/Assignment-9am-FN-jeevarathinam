<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice task</title>

    <!-- bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- tailwindcss link -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black">
    <h1 class="text-center mb-8 text-xl-center text-white">task3:style a box with background, padding, rounded corners, and shadow</h1>

    <div class="text-center bg-yellow-300 p-5 rounded-xl shadow-xl max-w-48 mb-4 mx-auto">
         This is a Tailwind-styled box!
    </div>

    <h1 class="text-center text-white mb-8">task4:Create a Tailwind flex layout with two items spaced apart</h1>
    <div class="flex justify-between p-4 bg-gray-700 max-w-md mx-auto">
        <div class="bg-blue-400 text-white px-4 py-2 rounded">Item 1</div>
        <div class="bg-green-500 text-white px-4 py-2 rounded">Item 2</div>
    </div>

    <h1 class="text-center text-white mb-8 mt-8">task5:Recreate the same layout once with Bootstrap and once with Tailwind</h1>
    <!-- bootstrap version -->

     <div class="d-flex justify-content-between p-4 bg-secondary max-w-md mx-auto">
        <div class="bg-info text-white px-4 py-2 rounded-5">Item 1</div>
        <div class="bg-success text-white px-4 py-2 rounded-5">Item 2</div>
    </div>
    <br><br>

    <!-- tailwind version -->

     <div class="flex justify-between p-4 bg-gray-700 max-w-md mx-auto">
        <div class="bg-blue-400 text-white px-4 py-2 rounded-full">Item 1</div>
        <div class="bg-green-500 text-white px-4 py-2 rounded-full">Item 2</div>
    </div>

    
</body>
</html>

<!-- Add Tailwind via CDN and style a box with background, padding, rounded corners, and shadow.

Create a Tailwind flex layout with two items spaced apart.

Recreate the same layout once with Bootstrap and once with Tailwind. -->
