<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pricing table</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">


</head>
<body>
    <section id="pricing" class="container mb-5">
    <h2 class="text-center fw-bold mb-4" style="color:#05c2f7;">Pricing Plans</h2>

    <div class="row text-center">

        <div class="col-md-4 mb-3">
            <div class="p-4 border rounded shadow">
                <h3 class="fw-bold">Basic</h3>
                <h1 class="moxy-color fw-bold">$49</h1>
                <p>1 Night • Free WiFi</p>
                <button class="btn btn-dark w-100" style="background:#05c2f7;border:none;">Choose</button>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="p-4 border rounded shadow">
                <h3 class="fw-bold">Standard</h3>
                <h1 class="moxy-color fw-bold">$79</h1>
                <p>2 Nights • Breakfast Included</p>
                <button class="btn btn-dark w-100" style="background:#05c2f7;border:none;">Choose</button>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="p-4 border rounded shadow">
                <h3 class="fw-bold">Premium</h3>
                <h1 class="moxy-color fw-bold">$119</h1>
                <p>3 Nights • Lounge Access</p>
                <button class="btn btn-dark w-100" style="background:#05c2f7;border:none;">Choose</button>
            </div>
        </div>

    </div>
</section>

    
</body>
</html>
