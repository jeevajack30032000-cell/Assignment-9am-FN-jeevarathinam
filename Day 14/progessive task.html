<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Custom height utility for the placeholder */
        .h-300px {
            min-height: 300px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- 
        1. Responsive Navigation Bar (Bootstrap Navbar Component)
    -->
    <nav class="navbar navbar-expand-sm navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <!-- Logo / Brand -->
            <a class="navbar-brand fw-bold fs-4 text-primary" href="#">AppLogo</a>
            
            <!-- Mobile Menu Button (Hamburger) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menu Items (Collapsible on Mobile) -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <!-- 'active' class on Home -->
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <!-- Standard links -->
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 
        2. Main Content Layout (Responsive Bootstrap Grid Hero Section)
        The grid converts the two-column layout into a Bootstrap row with two columns.
    -->
    <div class="container mt-5">
        <div class="row p-4 p-md-5 bg-white rounded-4 shadow-lg">
            
            <!-- 
                Right Column: Image Placeholder / Feature
                - col-12 for full width on mobile
                - col-md-6 for half width on desktop/tablet
                - order-1 sets it to appear first on mobile
                - order-md-2 sets it to appear second on desktop/tablet (right side)
            -->
            <div class="col-12 col-md-6 order-1 order-md-2 d-flex align-items-center justify-content-center bg-primary-subtle rounded-3 mb-4 mb-md-0 h-300px">
                <div class="text-center text-primary">
                    <svg class="mb-3" style="width: 64px; height: 64px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13.75a.75.75 0 01-.75.75H9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15.5V6.75"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19.5V11.75"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19V14.75"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 17.5V19"></path></svg>
                    <p class="fw-bold fs-5">Structured Layout Example</p>
                </div>
            </div>

            <!-- 
                Left Column: Hero Content / CTA
                - col-12 for full width on mobile
                - col-md-6 for half width on desktop/tablet
                - order-2 sets it to appear second on mobile
                - order-md-1 sets it to appear first on desktop/tablet (left side)
            -->
            <div class="col-12 col-md-6 order-2 order-md-1 d-flex flex-column justify-content-center">
                <h1 class="display-5 fw-bold text-dark mb-3">
                    Build Stunning UIs <span class="text-primary">Fast.</span>
                </h1>
                <p class="lead text-secondary mb-4">
                    This new section demonstrates responsive layout control using Bootstrap's column ordering.
                </p>
                <!-- CTA Buttons with spacing utilities -->
                <div class="d-grid gap-3 d-sm-flex">
                    <button class="btn btn-primary btn-lg shadow-lg" type="button">
                        Start Free Trial
                    </button>
                    <button class="btn btn-outline-primary btn-lg" type="button">
                        View Features
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle (required for Navbar collapse) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


    
</body>
</html>
