<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Text Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding: 2rem; line-height: 1.5; }
    .card { max-width: 720px; margin: 0 auto; padding: 1.25rem; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); }
    h1 { margin-top: 0; }
    .controls { display:flex; gap: .5rem; flex-wrap:wrap; margin-top: 1rem; }
    input[type="text"]{ padding: .5rem; border-radius:6px; border:1px solid #ddd; min-width: 200px; }
    button { padding:.5rem .75rem; border-radius:8px; border:none; cursor:pointer; background:#2563eb; color:white; }
    button.secondary{ background:#6b7280; }
    p#dynamicText { background:#f8fafc; padding: .75rem; border-radius:8px; }
    footer{ font-size:.9rem; color:#374151; margin-top:1rem }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dynamic Text with JavaScript</h1>
    <p id="dynamicText">This text will change when you click the button or submit a new value below.</p>

    <div class="controls">
      <button id="changeTextBtn">Change paragraph text</button>
      <button id="resetBtn" class="secondary">Reset text</button>
      <input id="newTextInput" type="text" placeholder="Type new text here..." />
      <button id="applyInputBtn">Apply input to paragraph</button>
      <button id="aboutBtn" class="secondary">Log "About Me" to console</button>
    </div>

    <footer>
      Open your browser console (F12 or Ctrl+Shift+I) to see logs created by the script.
    </footer>
  </div>

  <script>
    // 1) Welcome alert when the page loads
    window.addEventListener('load', () => {
      alert('Welcome — this page demonstrates dynamic text with JavaScript!');
    });

    // 2) Log some details to the console (favorite hobby, food, color)
    const favorite = {
      hobby: 'painting',
      food: 'sushi',
      color: 'teal'
    };
    console.log('Favorite hobby:', favorite.hobby);
    console.log('Favorite food:', favorite.food);
    console.log('Favorite color:', favorite.color);

    // 3) "About Me" function that prints multiple details to the console
    function aboutMe() {
      const me = {
        name: 'Alex Example',
        age: 28,
        profession: 'Web developer',
        skills: ['HTML', 'CSS', 'JavaScript']
      };
      console.group('About Me');
      console.log('Name:', me.name);
      console.log('Age:', me.age);
      console.log('Profession:', me.profession);
      console.log('Skills:', me.skills.join(', '));
      console.groupEnd();
    }

    // Call once so the console already shows the info when the page opens
    aboutMe();

    // 4) DOM interactions: change the paragraph text when a button is clicked
    const dynamicTextP = document.getElementById('dynamicText');
    const changeTextBtn = document.getElementById('changeTextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const newTextInput = document.getElementById('newTextInput');
    const applyInputBtn = document.getElementById('applyInputBtn');
    const aboutBtn = document.getElementById('aboutBtn');

    const originalText = dynamicTextP.textContent;

    changeTextBtn.addEventListener('click', () => {
      // create a dynamic message that includes the current time
      const now = new Date();
      dynamicTextP.textContent = `Hello! The current time is ${now.toLocaleTimeString()}. Click reset to go back.`;
    });

    resetBtn.addEventListener('click', () => {
      dynamicTextP.textContent = originalText;
    });

    applyInputBtn.addEventListener('click', () => {
      const val = newTextInput.value.trim();
      if (val.length === 0) {
        alert('Please type some text in the input before applying.');
        return;
      }
      dynamicTextP.textContent = val;
      newTextInput.value = '';
    });

    // button to call aboutMe again and log to console
    aboutBtn.addEventListener('click', () => {
      aboutMe();
      console.info('About Me has been logged to the console again.');
    });

    // Small example: show how to update text from JavaScript after 5 seconds
    setTimeout(() => {
      console.log('Updating paragraph text programmatically after 5 seconds...');
      dynamicTextP.textContent = 'Text updated programmatically after 5 seconds.';
    }, 5000);

  </script>
</body>
</html>
