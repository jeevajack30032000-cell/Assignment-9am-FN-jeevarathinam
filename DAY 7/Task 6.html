<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT-CARD</title>
    <style>
        body {
            background-color: antiquewhite;
        }
        .h2{
         margin-top: 50px;
         margin-left: 50px;
        }

        .product-card {
            background-color: white;
            margin: 50px;
            padding: 20px;
            border: 5px solid black;
            width: 200px;
            border-radius: 10px;
        }
         .product-card img {
            width: 200px;
        }
        .product-card p{
            font-style: italic;
            font-size: medium;
        }
        .product-card button{
            background-color: lightgreen;
            color: black;
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>

</head>

<body>
    <h2 class="h2">JORDEN SHOES PRODUCT-CARD</h2>
    <div class="product-card">
        <img src="./AIR+JORDAN image.png" alt="Air jorden shoes">
        <h2>Air Jordan 1 Low SE Men's Shoes</h2>
        <p>This low-top AJ1 remakes a classic with new colours and textures.</p>
            <p> PRICE: RS 10,500 </p>
            <button>buy</button> <BR><br>
        <button>Add to cart</button>

</body>

</html>
