<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="product-card">
    <img src="https://via.placeholder.com/300x200" alt="Product Image" class="product-image">
    <div class="product-info">
      <h2 class="product-title">Wireless Headphones</h2>
      <p class="product-description">High-quality noise-cancelling headphones with 20 hours of battery life.</p>
      <p class="product-price">$99.99</p>
      <button class="buy-btn">Add to Cart</button>
    </div>
  </div>
</body>
</html>
