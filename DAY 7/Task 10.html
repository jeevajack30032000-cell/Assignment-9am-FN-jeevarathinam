<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-box layout</title>
    <style>
        .three-boxes {
            display: flex;
            gap: 20px;
        }

        .three-boxes div {
            width: 300px;
            height: 100px;
            background-color:yellow;
            border: 2px solid grey;
            text-align: center;
            line-height: 100px;
        }

        .box1 {
            margin: 10px;
            padding: 5px;
        }

        .box2 {
            margin: 20px;
            padding: 15px;
        }

        .box3 {
            margin: 30px;
            padding: 25px;
        }
    </style>
</head>

<body>
    <h2>3-box layout</h2>
    <div class="three-boxes">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
        <div class="box3">Box 3</div>
    </div>
</body>

</html>
