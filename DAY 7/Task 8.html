<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>PROFILE CARD</title>
    <style>
        body{
            margin-top: 50px;
            margin-left: 600px;
            margin-bottom: 50px;

        .body-1{
            border: 5px solid black;
            width: 350px;
            text-align: center;
            background-color: aquamarine;
            border-radius: 5px;
        }
        img{
            width: 300px;
            margin-top: 20px;
        }
        .profile-card {
            width: 300px;

            background-color: white;
            margin: 30px 0;

        .profile-section {
            padding: 20px;
            border-bottom: 1px solid black;
            font-weight: bolder;
            font-size: 20px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .profile-section:last-child {
            border-bottom: none;
        }
    </style>

</head>

<body>
    <div class="body-1">
        <image src="./profile card dummy image.jpg" alt="profile card">
            <h2>PROFILE CARD</h2>
            <div class="profile-card">
