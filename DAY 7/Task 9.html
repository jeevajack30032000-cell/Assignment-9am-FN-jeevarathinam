<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTIFICATION ALERT BOX</title>
    <style>
        h2{
            font-size: xx-large;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
            color: darkgrey;
            background-color: black;
            margin:20px ;
        }
        .alert-box{
            margin: 20px;
            border: 5px solid black;
            padding: 30px;
            background-color: red;
            border-radius: 10px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: xx-large;
        }
    </style>

</head>
<body>
    <h2>Notification alert box</h2>
    <div class="alert-box">
    ALERT!:Please check your connection before submitting the form.
  </div>
    
    
</body>
</html>
