<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN FORM BOX</title>
</head>

<style>
    body{
        background-color: aquamarine;
        margin-left: 500px;
        margin-top: 250px;
    }
   .Login {
      width: 400px;
      background-color: white;
      border: 2px solid gray;
      border-radius: 10px;
      padding: 30px;
      margin: 20px 0;
    }

    .Login input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid gray;
      border-radius: 5px;
    }

    .Login button {
      width: 100%;
      background-color: darkblue;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      cursor: pointer;
    }
</style>

<body>
    <div class="Login">
        <h2>LOGIN</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>

</body>

</html>
