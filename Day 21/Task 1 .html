<!-- Print numbers 1–10 using a for loop.

Print even numbers using a while loop.

Use a do…while to print 1 run even if condition is false.

Loop through an array using for…of.

Loop through an object using for…in. -->
    <script>
        // Print numbers 1–10 using a for loop.
        console.log("Numbers 1 to 10:");
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // Print even numbers using a while loop.
        console.log("Even Numbers:");
        let num = 2;
        while (num <= 20) {
            console.log(num);
            num += 2;
        }

        // Use a do…while to print 1 run even if condition is false.
        console.log("Do...While Example:");
        let count = 5;
        do {
            console.log("This will print at least once.");
        } while (count < 5);

        // Loop through an array using for…of.
        console.log("Array Loop:");
        const fruits = ["Apple", "Banana", "Cherry"];
        for (const fruit of fruits) {
            console.log(fruit);
        }

        // Loop through an object using for…in.
        console.log("Object Loop:");
        const person = {
            name: "John",
            age: 30,
            city: "New York"
        };
        for (const key in person) {
            console.log(`${key}: ${person[key]}`);
        }
    </script>
