<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >



</head>
<body>
     <!-- task1: Create a .container with a heading and paragraph -->
    <div class="container my-5">
        <h1 class="display-1 mb-3">practice task bootstrap</h1>      <!-- task3: .display-1 to a heading */ -->
        <p class="lead">this is first task with .conatiner</p>
    </div>

    <!-- task 2: Build three columns using .col classes -->
    <div style="width:85%;" class="row mt-4 mx-auto">
        <div class="col">
          <div class="p-3 bg-light border rounded">Column 1</div>
        </div>
        <div class="col">
          <div class="p-3 bg-light border rounded">Column 2</div>
        </div>
        <div class="col">
          <div class="p-3 bg-light border rounded">Column 3</div>
        </div>
      </div>

       <!-- task 4: spacing utilities -->
      <div style="width:85%" class="mt-5 p-4 bg-primary text-white rounded mx-auto">
        This is a padded box created with spacing utilities.
      </div>

      <!-- task 5:flexbox row using d-flex and justify-content-center -->

      <div class="mt-5 d-flex justify-content-center">
        <div class="p-3 bg-secondary text-white mx-2">Flex item 1</div>
        <div class="p-3 bg-secondary text-white mx-2">Flex item 2</div>
        <div class="p-3 bg-secondary text-white mx-2">Flex item 3</div>
      </div>
    </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
