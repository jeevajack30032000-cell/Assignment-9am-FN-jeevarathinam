<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsive pricing table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-hover:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }
    </style>


</head>

<body>

    <div class="container py-5">
        <h2 class="text-center mb-5">Pricing</h2>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Card 1 -->
            <div class="col card-hover">
                <div class="card h-100 text-center">
                    <div class="card-header bg-info text-white">
                        Basic
                    </div>
                    <div class="card-body">
                        <h3 class="card-title pricing-card-title mb-3">
                            ₹499 <small class="text-muted fs-6">/ month</small>
                        </h3>
                        <ul class="list-unstyled mb-4">
                            <li>one device access</li>
                            <li>with ads</li>
                            <li>hd quality</li>
                        </ul>
                        <a href="#" class="btn btn-outline-primary bg-info text-white w-100">Choose plan</a>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col card-hover">
                <div class="card h-100 border-primary text-center">
                    <div class="card-header bg-secondary text-white">
                        Pro
                    </div>
                    <div class="card-body">
                        <h3 class="card-title pricing-card-title mb-3">
                            ₹999 <small class="text-muted fs-6">/ month</small>
                        </h3>
                        <ul class="list-unstyled mb-4">
                            <li>2 device access</li>
                            <li>with ads</li>
                            <li>2k quality</li>
                        </ul>
                        <a href="#" class="btn btn-secondary w-100">Choose plan</a>
                    </div>
                </div>
            </div>

             <!-- card 3 -->
            <div class="col card-hover">
                <div class="card h-100 text-center">
                    <div class="card-header bg-warning text-white">
                        Enterprise
                    </div>
                    <div class="card-body">
                        <h3 class="card-title pricing-card-title mb-3">
                            ₹1,999 <small class="text-muted fs-6">/ month</small>
                        </h3>
                        <ul class="list-unstyled mb-4">
                            <li>multiple device access</li>
                            <li>ad-free</li>
                            <li>4k quality</li>
                        </ul>
                        <a href="#" class="btn btn-outline-secondary bg-warning text-white w-100">choose plan</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>


<!-- Build a responsive pricing table (3 cards) -->
