<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsive photo gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .gallery-image {
            width: 100%;
            height: 250px; /* Fixed height for consistent look */
            object-fit: cover; /* Ensures image covers the area without distortion */
            border-radius: 0.5rem; /* Rounded corners */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-image {
            transform: scale(1.03);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .card-body {
            padding: 0.75rem;
        }

        .gallery-container {
            padding-top: 3rem;
            padding-bottom: 3rem;
        }
    </style>

    
</head>
<body class="bg-light">

    <div class="container gallery-container">
        <h1 class="text-center fw-bold mb-5 text-dark">Responsive Bootstrap Gallery</h1>
        


     <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            
            <!-- Gallery Item 1 -->
            <div class="col gallery-item">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <img src="https://i.pinimg.com/736x/80/e3/7b/80e37ba64838a223a6a85ce1fd2564e9.jpg" class="gallery-image" alt="Gallery Image 1">
                    <div class="card-body">
                        <p class="card-text text-muted small mb-0">Category: Nature</p>
                        <h5 class="card-title fw-semibold text-dark">Mountain Vista</h5>
                    </div>
                </div>
            </div>
             <!-- Gallery Item 2 -->
            <div class="col gallery-item">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <img src="https://i.pinimg.com/736x/b8/1b/d4/b81bd419c28b081b668c46409721bb11.jpg" class="gallery-image" alt="Gallery Image 2">
                    <div class="card-body">
                        <p class="card-text text-muted small mb-0">Category: City</p>
                        <h5 class="card-title fw-semibold text-dark">Urban Lights</h5>
                    </div>
                </div>
            </div>
            
            <!-- Gallery Item 3 -->
            <div class="col gallery-item">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <img src="https://i.pinimg.com/1200x/d6/6f/d9/d66fd9f49bcc96eb877d2a2b4933aad0.jpg" class="gallery-image" alt="Gallery Image 3">
                    <div class="card-body">
                        <p class="card-text text-muted small mb-0">Category: Abstract</p>
                        <h5 class="card-title fw-semibold text-dark">Geometric Forms</h5>
                    </div>
                </div>
            </div>

            <!-- Gallery Item 4 -->
            <div class="col gallery-item">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <img src="https://i.pinimg.com/736x/6d/5d/e2/6d5de28c80b6f6eb6df0022c4db52577.jpg" class="gallery-image" alt="Gallery Image 4">
                    <div class="card-body">
                        <p class="card-text text-muted small mb-0">Category: Food</p>
                        <h5 class="card-title fw-semibold text-dark">Delicious Treat</h5>
                    </div>
                </div>
            </div>

            <!-- Gallery Item 5 -->
            <div class="col gallery-item">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <img src="https://i.pinimg.com/736x/9b/a8/2e/9ba82eb0d097002b1cc12ede2601ad9c.jpg" class="gallery-image" alt="Gallery Image 6">
                    <div class="card-body">
                        <p class="card-text text-muted small mb-0">Category: People</p>
                        <h5 class="card-title fw-semibold text-dark">Portrait Shot</h5>
                    </div>
                </div>
            </div>

            <!-- Gallery Item 6 -->
            <div class="col gallery-item">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <img src="https://i.pinimg.com/736x/14/d5/3d/14d53d744c08fcca99dfcdaa3bac5d82.jpg" class="gallery-image" alt="Gallery Image 7" onerror="this.onerror=null; this.src='https://placehold.co/600x400?text=Placeholder'">
                    <div class="card-body">
                        <p class="card-text text-muted small mb-0">Category: Wildlife</p>
                        <h5 class="card-title fw-semibold text-dark">Forest Animal</h5>
                    </div>
                </div>
            </div>    
        </div>
         <div class="text-center mt-5">
            <button class="btn btn-primary btn-lg shadow-sm" type="button">Load More Photos</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        
    
</body>
</html>
