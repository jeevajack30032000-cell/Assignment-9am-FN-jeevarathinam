<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRACTICE Task</title>
    <style>
        body {
             margin: 0px;
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(to right pink);
        }

        h1 {
            text-align: center;
            font-size: 60px;
            text-shadow: 3px 3px 5px black;
            color: black;
            transform: rotate(-3deg);
            margin-top: 40px;

        }

        .banner {
            height: 300px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: black;
            text-align: center;
            font-size: 40px;
            padding-top: 120px;
            margin-top: 40px;

        }

        .container {
            position: relative;
            height: 400px;
            background-color: aquamarine;
            border-radius: 10px;
            margin: 40px;

        }

        .a1 {
            width: 150px;
            height: 150px;
            background: azure;
            position: relative;
            top: 20px;
            left: 20px;
            text-align: center;

        }

        .a2 {
            width: 150px;
            height: 150px;
            background: pink;
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: center;
        }

        .a3 {
            width: 150px;
            height: 150px;
            background: yellow;
            position: fixed;
            top: 20px;
            left: 20px;
            text-align: center;
        }
    </style>

</head>

<body>
    <h1> HELLO WORLD AM JEEVA HERE</h1>
    <div class="banner"> <b>MR.jack is my ID</b>
    </div>
    <div class="container">
        <div class="a1"> <b>this section is for the relative</b></div>
        <div class="a2"><b>this section is for absolute</b></div>
    </div>
    <div class="a3"><b>this section is for fixed</b>
    </div>


</body>

</html>
