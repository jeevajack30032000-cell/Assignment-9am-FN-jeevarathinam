<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
    // Display dynamic text
    document.body.innerHTML += "<h1>Welcome to My Page</h1>";

    // Welcome alert on page load
    window.onload = function() {
        alert("Welcome to my website!");
    };

    // Log favorite hobby, food, and color
    console.log("My favorite hobby is painting.");
    console.log("My favorite food is pizza.");
    console.log("My favorite color is blue.");

    // Button to change text inside a <p>
    function changeText() {
        document.getElementById("myParagraph").innerText = "The text has been changed!";
    }

    // About Me script
    console.log("About Me:");
    console.log("Name: John Doe");
    console.log("Age: 30");
    console.log("Occupation: Developer");
    </script>
    <body>
</html>
