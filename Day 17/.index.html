<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Alert</title>
    <script>
        window.onload = function() {
            alert("Welcome to my webpage!");
        };
    </script>
</head>
<body>
    <h1>Hello World!</h1>
</body>
</html>
<!-- // Build a simple “Welcome” alert that triggers when the page loads. -->
