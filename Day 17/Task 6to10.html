<!-- Create an HTML page and display dynamic text using JavaScript. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Text Example</title>
    <script>
        function changeDynamicText() {
            document.getElementById("dynamicText").innerText = "The text has been changed dynamically!";
        }
        



        // function displayDynamicText() {
        //     const dynamicText = "Welcome to my dynamic webpage!";
        //     document.getElementById("dynamic-text").innerText = dynamicText;
        // }
        // window.onload = displayDynamicText;
    </script>
</head>
<body></body>
    <div>
      <h2>Dynamic Text</h2>
      <p>Click the button to change the text dynamically:</p>
      <button onclick="changeDynamicText()">Change Text</button>
      <div id="dynamicText" class="dynamic-text">
        Click the button to see dynamic JavaScript in action!
      </div>
    </div>

</body>
</html>
