<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practical task</title>

    </head>

<body>
    <h1>JavaScript Interaction Page</h1>

    <p id="dynamicText">Click the button to change this text.</p>

    <button onclick="showDynamicText()">Change Text</button>

    <script>
        // ----- PAGE LOAD ALERT -----
        window.onload = function () {
            alert("Welcome to my webpage!");
        };

        // ----- DYNAMIC TEXT DISPLAY -----
        function showDynamicText() {
            document.getElementById("dynamicText").innerText = "This text was changed using JavaScript!";
        }

        // ----- LOGGING FAVORITE THINGS -----
        console.log("My favorite hobby: Drawing");
        console.log("My favorite food: Pizza");
        console.log("My favorite color: Blue");

        // ----- ABOUT ME SCRIPT -----
        function aboutMe() {
            console.log("---- About Me ----");
            console.log("Name: Jeeva");
            console.log("Age: 20");
            console.log("Country: India");
            console.log("Goal: Become a skilled Web Developer");
        }

        // Call About Me on load
        aboutMe();
    </script>


</body>
</html>
