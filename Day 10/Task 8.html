<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard layout</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .dashboard {
            background-color: antiquewhite;
            display: grid;
            grid-template-areas:
                " header header "
                " aside  main "
                " footer footer";
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 80px;
            min-height: 500px;
        }

        .header {
            grid-area: header;
            display: grid;
            justify-content: center;
            background: #4679bd;
            color: #fff;
            padding: 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 30px;
        }

        .aside {
            grid-area: aside;
            padding: 30px;
            display: grid;
            background: #8cb3f9;

        }

        .main {
            grid-area: main;
            display: grid;
            background: #e9e9e9;
            justify-content: center;

        }

        .stats {
            background-color: #8cb3f9;
            margin-bottom: 50px;

        }

        .card {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
        }

        .footer {
            grid-area: footer;
            background: #3f5b91;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <header class="header">
            dashboard
        </header>

        <aside class="aside">
            <h2>category & suppliers</h2>
            <h3>category 1</h3>
            <h3>category 2</h3>
            <h3>category 3</h3>
        </aside>

        <main class="main">
            <h2> dashboard overview</h2>
            <div class="stats">
                <div class="card">users</div>
                <div class="card">sales</div>
                <div class="card">revenue</div>
                <div class="card">orders</div>
            </div>
        </main>
        <footer class="footer">
            &copy;2025 | all rights resevered
        </footer>

    </div>

</body>

</html>

<!-- Design a dashboard layout using Grid. -->
