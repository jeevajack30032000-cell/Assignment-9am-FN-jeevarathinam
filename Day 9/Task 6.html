<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> task-6</title>
    <style>
        body {
            background-color: darkcyan;
            margin: 20px;
        }

        .container-column1 {
            display: flex;
            flex-direction:column;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
        }
        .container-column2 {
            display: flex;
            flex-direction:column;
            justify-content: space-evenly;
            align-items: center;
             gap: 10px;
           
        }
        .container-column3 {
            display: flex;
            flex-direction:column;
            justify-content: space-between;
            align-items: flex-start;
             gap: 10px;
        }

        .column {
            background-color: blanchedalmond;
            flex: 1;
            margin: 10px;
            width:400px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>3-column layout using Flexbox</h1>
    <div class="container-column1">
        <div class="column"><b>box 1</b></div>
        <div class="column"><b>box 2</b></div>
        <div class="column"><b>box 3</b></div>
    </div>
    <div class="container-column2">
         <div class="column"><b>box 1</b></div>
        <div class="column"><b>box 2</b></div>
        <div class="column"><b>box 3</b></div>
    </div>
     <div class="container-column3">
         <div class="column"><b>box 1</b></div>
        <div class="column"><b>box 2</b></div>
        <div class="column"><b>box 3</b></div>
    </div>



</body>

</html>
