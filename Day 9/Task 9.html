<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox using space-evenly</title>
    <style>
        h2{
            background-color: black;
            color: white;
            text-align: center;
            font-size: x-large;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        .Flexbox-container{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background-color: rgb(247, 218, 2);
            width: 100%;
            padding: 20px;
            margin-top: 20px;
        }
        button{
            color: rgb(0, 7, 8);
            background-color: rgb(247, 220, 153);
        }
    </style>
</head>
<body>
    <h2>welcome to duke</h2>
    <div class="Flexbox-container">
        <button type="button">home</button>
        <button type="button">works</button>
        <button type="button">about us</button>
        <button type="button">contact</button>
    </div>
    
</body>
</html>

<!-- Align buttons in a Flexbox container with space-evenly -->
