<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task-4</title>
    <style>
        h2 {
            text-align: center;
            background-color: blanchedalmond;
            text-transform: uppercase;
        }

        .vertically-container {
            display: flex;
            align-items: center;
            height: 300px;
            background-color: aqua;
            border-radius: 5px;

        }

        .box {
            background-color: blanchedalmond;
            border: 1px solid black;
            padding: 20px;

        }

        .horizontally-container {
            display: flex;
            justify-content: center;
            height: 300px;
            background-color: aqua;
            border-radius: 5px;
            margin-top: 30px;
            padding: 30px;
        }
    </style>
</head>

<body>
    <h2>Center an element vertically and horizontally using Flexbox</h2>
    <div class="vertically-container">
        <div class="box">align-items is used to align the item vertically.
            and use flex-start,flex-end,center to see changes.
        </div>
    </div>
    <div class="horizontally-container">

        <div class="box">justify-content is used to align the content horizontally.
            use space-around,space-between,center,space-evenly to see changes.
        </div>
    </div>

</body>

</html>

<!-- Center an element vertically and horizontally using Flexbox. -->
