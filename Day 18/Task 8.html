<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Counter</title>
</head>
<body>

<h2>Loop Counter Results</h2>
<div id="output"></div>

<script>
    let output = document.getElementById("output");
    let counter = 0; // stores intermediate value

    // Loop from 1 to 10
    for (let i = 1; i <= 10; i++) {
        counter = i; 
        output.innerHTML += "Counter value: " + counter + "<br>";
    }
</script>

</body>
</html>

<!-- // Build a loop counter using let and show results on the page. -->
