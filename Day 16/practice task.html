<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice task</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
<!-- 
  task 1: create a model with a title and paragraph
  task 2: build a carousel with at least two images
  task 3: add an icon next to a heading
  task 4: create a collapse section labeled "more info"
  task 5: Customize a button using spacing and color utilities. -->


  <style>
    .small-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #0d6efd;
      display: inline-block;
      margin-right: 8px;
    }
    img.d-block.w-10{
        width: 200px;
        height: 200px;
    }
  </style>
</head>

<body class="p-4">

  <h3 class="text-primary">
  <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-twitch" viewBox="0 0 16 16">
  <path d="M3.857 0 1 2.857v10.286h3.429V16l2.857-2.857H9.57L14.714 8V0zm9.714 7.429-2.285 2.285H9l-2 2v-2H4.429V1.143h9.142z"/>
  <path d="M11.857 3.143h-1.143V6.57h1.143zm-3.143 0H7.571V6.57h1.143z"/>
</svg> bootstrap!
</h3>

  <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#exampleModal">
    Open Bootstrap Modal
  </button>

  <div class="modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Bootstrap Modal Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>This is a modal body paragraph created using Bootstrap components.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="exampleCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://i.pinimg.com/736x/25/c4/91/25c4913f12a45b72601dcd757baf88b0.jpg" class="d-block w-10 " 
        alt="Slide 1">
      </div>
      <div class="carousel-item">
        <img src="https://i.pinimg.com/736x/c8/12/96/c81296b4a63f966d09094ec00854b680.jpg" class="d-block w-10"
         alt="Slide 2">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#exampleCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#exampleCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>


  <h3 class="d-flex align-items-center mb-3">
    <span class="small-circle"></span>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-through-heart-fill" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M2.854 15.854A.5.5 0 0 1 2 15.5V14H.5a.5.5 0 0 1-.354-.854l1.5-1.5A.5.5 0 0 1 2 11.5h1.793l3.103-3.104a.5.5 0 1 1 .708.708L4.5 12.207V14a.5.5 0 0 1-.146.354zM16 3.5a.5.5 0 0 1-.854.354L14 2.707l-1.006 1.006c.236.248.44.531.6.845.562 1.096.585 2.517-.213 4.092-.793 1.563-2.395 3.288-5.105 5.08L8 13.912l-.276-.182A24 24 0 0 1 5.8 12.323L8.31 9.81a1.5 1.5 0 0 0-2.122-2.122L3.657 10.22a9 9 0 0 1-1.039-1.57c-.798-1.576-.775-2.997-.213-4.093C3.426 2.565 6.18 1.809 8 3.233c1.25-.98 2.944-.928 4.212-.152L13.292 2 12.147.854A.5.5 0 0 1 12.5 0h3a.5.5 0 0 1 .5.5z"/>
</svg>
    <span>Bootstrap Heading with Icon</span>
  </h3>
  <p class="mb-3">The small blue circle simulates an icon placed next to the heading.</p>

 
  <p>
    <a class="btn btn-outline-primary" data-bs-toggle="collapse" href="#moreInfoCollapse" role="button" aria-expanded="false" aria-controls="moreInfoCollapse">
      More Info
    </a>
  </p>
  <div class="collapse mb-3" id="moreInfoCollapse">
    <div class="card card-body">
      This content is inside a Bootstrap collapse component labeled “More Info”.
    </div>
  </div>


  <button class="btn text-white bg-success px-4 py-2 mt-2">
    Custom Utility Button
  </button>

 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
