<!-- 5. Difference between localStorage and sessionStorage -->


<!-- Answer:

localStorage and sessionStorage are both Web Storage APIs used to store key/value pairs in the browser.

Key differences:
1. Lifetime: localStorage persists until explicitly cleared; sessionStorage lasts only for the current tab/session.
2. Scope: localStorage is shared across all tabs/windows of the same origin; sessionStorage is isolated per tab.
3. Use case: localStorage is good for long-term preferences; sessionStorage is good for temporary form state or one-time flows.
4. Capacity: both typically allow around 5–10 MB depending on the browser.
