<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT LIST</title>
    <style>
        body {
            background-color: aquamarine;
            margin: 0px;
        }

        h1 {
            background-color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
            text-transform: uppercase;
            color: red;
            margin: 0px;
            text-align: center;
            padding: 40px;
        }

        img[ src$=".jpg"] {
            border: 5px solid red;
            width: 300px;
            height: 300px;
            border-radius: 10px;
        }

        input[type="button"] {
            background-color: lightgreen;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: green;
            color: white;
        }
        .product{
            display:inline-block;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bolder;
            border: 5px solid black;
            border-radius: 5px;
            padding: 10px;
            background-color: azure;
            margin: 20px;
        }
    </style>
</head>

<body>
    <h1>jordan shoes</h1>
    <div class="product">
        <img src="./jorden 9 retro.jpg" alt="JORDAN-9 RETRO SHOE">
        <p>price:$999</p>
        <p>jordan-9 retro shoes is an classic vintage model</p>
        <input type="button" value="buy now">
    </div>
    <div class="product">
        <img src="./jorden shoes.jpg" alt="JORDAN-air blue">
        <p>price:$899</p>
        <p>jordan-air blue give a elegant fell</p>
        <input type="button" value="buy now">
    </div>
    <div class="product">
        <img src="./jorden XXIX.jpg" alt="JORDAN-XXIX">
        <p>price:$799</p>
        <p>jordan-XXIX model shoes boost your speed while run</p>
        <input type="button" value="buy now">
    </div>

</body>

</html>
