<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE</title>
    <style>
        * {
            padding: 10px;
            margin: 30px;
        }

        input[type=text] {
            width: 50%;
            padding: 6px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type=number] {
            width: 50%;
            padding: 6px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type=submit] {
            width: 50%;
            background-color: #4CAF50;
            color: white;
            padding: 7px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;

        }
    </style>
</head>

<body>
    <h1>LOGIN PAGE</h1>
    <form>
        <label>NAME:</label>
        <input type="text"><br><br>

        <label>AGE:</label>
        <input type="number"><br><br>

        <label>PASSWORD:</label>
        <input type="number"><br><br>

        <input type="submit" value="submit">
    </form>

</body>

</html>
